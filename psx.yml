version: 1

project:
  type: go
  kind: cli

rules:
  readme: error
  license: error
  package_manager: error
  lockfile: error
  gitignore: error
  gitattributes: info
  changelog: error
  src_folder: false
  tests_folder: error
  scripts_folder: info
  makefile: error
  docs_folder: info
  contributing: error
  security: error
  pull_request_template: error
  issue_templates: error
  ci_config: error
  release_workflow: error
  workflow_ci: error
  workflow_release: error
  editorconfig: info
  code_owners: info

ignore:
  - .git/
  - .deps/
  - .venv/
  - .tooling/
  - build/
  - dist/
  - coverage/
  - vendor/
  - .pipeline/
  - .pipeline-artifacts/
  - .psx/

fix:
  interactive: false
  backup: false
