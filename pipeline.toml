schema_version = 1

[project]
name = "cdin-registry"
description = "Provider-neutral validation, build and release tasks for the generic Registry engine"

[defaults]
timeout_seconds = 900
fail_fast = true

[tasks.deps]
description = "Download the pinned Go module graph"
command = ["go", "mod", "download"]
timeout_seconds = 600

[tasks.modules]
description = "Verify downloaded module checksums"
command = ["go", "mod", "verify"]
depends_on = ["deps"]

[tasks.format]
description = "Fail when Go source files are not gofmt-formatted"
command = ["python", "scripts/registry_checks.py", "format"]

[tasks.vet]
description = "Run the Go static analyzer"
command = ["go", "vet", "./..."]
depends_on = ["deps"]

[tasks.test]
description = "Run all unit and CLI integration tests"
command = ["go", "test", "./..."]
depends_on = ["deps"]
timeout_seconds = 600

[tasks.workspace-native]
description = "Run Workspace integration and failure-injection tests on the native host OS"
command = ["go", "test", "-count=1", "./internal/workspace/..."]
depends_on = ["deps"]
timeout_seconds = 600

[tasks.build]
description = "Compile every Go package"
command = ["go", "build", "./..."]
depends_on = ["deps"]
timeout_seconds = 600

[tasks.fuzz-smoke]
description = "Run short bounded fuzz campaigns for parser, SemVer, Catalog, Resolver and path trust boundaries"
command = ["python", "scripts/registry_checks.py", "fuzz-smoke"]
depends_on = ["deps"]
timeout_seconds = 300

[tasks.performance-smoke]
description = "Measure one iteration of bounded Catalog, Resolver, source-copy and cache-GC benchmarks"
command = ["python", "scripts/registry_checks.py", "benchmark-smoke"]
depends_on = ["deps"]
timeout_seconds = 300

[tasks.governance]
description = "Validate repository templates, PSX policy and GIX topology with executable tests"
command = ["go", "test", "./tests", "-run", "^TestRepositoryGovernance", "-count=1"]
depends_on = ["deps"]
timeout_seconds = 300

[tasks.gix-config]
description = "Parse and validate the committed GIX branch flow with GIX itself"
command = ["go", "run", "github.com/m-mdy-m/gix/cmd/gix@v1.2.0", "config", "list"]
depends_on = ["deps"]
timeout_seconds = 300

[tasks.boundary]
description = "Enforce Registry package and consumer-independence boundaries"
command = ["python", "scripts/registry_checks.py", "boundaries"]

[tasks.schema-sync]
description = "Verify local Registry schemas match the pinned CDIN Spec revision"
command = ["python", "scripts/registry_checks.py", "schema-sync", "check"]
timeout_seconds = 180

[tasks.structure]
description = "Check repository structure and governance with PSX"
command = ["go", "run", "github.com/m-mdy-m/psx/cmd/psx@v0.3.2", "check"]
depends_on = ["deps"]
timeout_seconds = 300

[tasks.race]
description = "Run the race detector on supported native toolchains"
command = ["go", "test", "-race", "./..."]
depends_on = ["deps"]
timeout_seconds = 900

[tasks.release-check]
description = "Run the cross-platform release verification gate"
command = ["git", "diff", "--check"]
depends_on = ["modules", "format", "vet", "test", "fuzz-smoke", "performance-smoke", "governance", "gix-config", "build", "boundary", "schema-sync", "structure"]
timeout_seconds = 900

[tasks.check]
description = "Run the complete CI quality gate, including race detection"
command = ["git", "diff", "--check"]
depends_on = ["release-check", "race"]
timeout_seconds = 1200
