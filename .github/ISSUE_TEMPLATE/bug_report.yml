name: Bug report
description: Report a reproducible Registry defect.
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For a security vulnerability, do not open a public issue; use the private reporting link in SECURITY.md.

  - type: input
    id: registry-version
    attributes:
      label: Registry version or commit
      placeholder: "0.1.0-dev / commit SHA"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Include the output of go version.
      placeholder: "go1.27.3"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - CLI
        - Product Definition validation
        - Catalog Index / metadata
        - Version and dependency resolution
        - Contract compatibility
        - Git source collection
        - Workspace / manifest / report
        - Build / CI / release
        - Other
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Ubuntu 24.04, linux/amd64"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the exact command and observed behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest input fixture and exact command that reproduces the issue.
      render: text
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste the relevant error or test output. Remove credentials, tokens and private repository URLs.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This is not a public disclosure of a security vulnerability.
          required: true
