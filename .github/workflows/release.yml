name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Cross-platform release (Pipeline)
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: m-mdy-m/pipeline/.github/workflows/release.yml@0c2c89c7c64575c6b0f66c78925bdf5638abc5e9
    with:
      pipeline-ref: 0c2c89c7c64575c6b0f66c78925bdf5638abc5e9
      go-version: "1.27.3"
      test-command: "python scripts/prepare-release-catalog.py --self-test && PYTHONPATH=.pipeline/src python -m pipeline.providers.github task release-check --json"
      build-command: "python scripts/registry_checks.py release-build"
      artifact-path: "dist/*"
      asset-preparation-command: "python scripts/prepare-release-catalog.py"
      changelog-path: "CHANGELOG.md"
      working-directory: "."
      # Pipeline's release target inherits PIPELINE_TARGET_* from the command
      # environment. The executable is pure Go (CGO_ENABLED=0), so each target
      # can be cross-compiled from its runner without assuming host GOARCH.
      build-matrix-json: >-
        {"include":[
          {"id":"linux-amd64","os":"ubuntu-24.04","build_command":"PIPELINE_TARGET_OS=linux PIPELINE_TARGET_ARCH=x86_64 python scripts/registry_checks.py release-build"},
          {"id":"linux-arm64","os":"ubuntu-24.04","build_command":"PIPELINE_TARGET_OS=linux PIPELINE_TARGET_ARCH=aarch64 python scripts/registry_checks.py release-build"},
          {"id":"darwin-amd64","os":"macos-15","build_command":"PIPELINE_TARGET_OS=macos PIPELINE_TARGET_ARCH=x86_64 python scripts/registry_checks.py release-build"},
          {"id":"darwin-arm64","os":"macos-15","build_command":"PIPELINE_TARGET_OS=macos PIPELINE_TARGET_ARCH=arm64 python scripts/registry_checks.py release-build"},
          {"id":"windows-amd64","os":"windows-latest","build_command":"PIPELINE_TARGET_OS=windows PIPELINE_TARGET_ARCH=x86_64 python scripts/registry_checks.py release-build"}
        ]}
