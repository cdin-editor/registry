name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Cross-platform release (Pipeline)
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: m-mdy-m/pipeline/.github/workflows/release.yml@158fd580e9e577df789fa9ba9e9c4c7740e0f426
    with:
      pipeline-ref: 158fd580e9e577df789fa9ba9e9c4c7740e0f426
      go-version: "1.27.3"
      test-command: "PYTHONPATH=.pipeline/src python -m pipeline.providers.github task release-check --json"
      build-command: "python scripts/registry_checks.py release-build"
      artifact-path: "dist/*"
      changelog-path: "CHANGELOG.md"
      working-directory: "."
      build-matrix-json: >-
        {"include":[
          {"id":"linux-amd64","os":"ubuntu-24.04"},
          {"id":"linux-arm64","os":"ubuntu-24.04"},
          {"id":"darwin-amd64","os":"macos-15"},
          {"id":"darwin-arm64","os":"macos-15"},
          {"id":"windows-amd64","os":"windows-latest"}
        ]}
