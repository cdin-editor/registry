name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate version from the immutable Git tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_ref: ${{ steps.validate.outputs.source_ref }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag identity and matching changelog section
        id: validate
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error title=Release requires a Git tag::Run workflow_dispatch against a version tag, not a branch."
            exit 2
          fi

          TAG_NAME="$GITHUB_REF_NAME"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+(-((dev|alpha|beta|rc)\\.[0-9]+))?$ ]]; then
            echo "::error title=Invalid release tag::Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-(dev|alpha|beta|rc).N; got $TAG_NAME."
            exit 2
          fi

          TAG_COMMIT="$(git rev-parse --verify "refs/tags/$TAG_NAME^{commit}")"
          HEAD_COMMIT="$(git rev-parse --verify HEAD)"
          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "::error title=Tag checkout mismatch::$TAG_NAME resolves to $TAG_COMMIT but the checkout is $HEAD_COMMIT."
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          python - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          pattern = re.compile(
              r"^\\s{0,3}#{1,6}\\s+\\[?" + re.escape(version)
              + r"\\]?(?:\\s*[-–—:].*)?$"
          )
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          matches = [number for number, line in enumerate(lines, 1) if pattern.fullmatch(line)]
          if len(matches) != 1:
              raise SystemExit(
                  f"CHANGELOG.md must contain exactly one heading for Git tag version "
                  f"{version}; found {len(matches)}"
              )
          print(f"Release changelog section for {version}: line {matches[0]}")
          PY

          printf 'source_ref=refs/tags/%s\\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
          printf 'version=%s\\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'Validated immutable release tag %s at %s\\n' "$TAG_NAME" "$TAG_COMMIT"

  release:
    name: Cross-platform release (Pipeline)
    needs: [validate-release-tag]
    if: needs.validate-release-tag.result == 'success'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: m-mdy-m/pipeline/.github/workflows/release.yml@1682c520bb5be073eeaa07db03a254fb2e247545
    with:
      pipeline-ref: 1682c520bb5be073eeaa07db03a254fb2e247545
      source-ref: ${{ needs.validate-release-tag.outputs.source_ref }}
      go-version: "1.27.3"
      test-command: "python scripts/prepare-release-catalog.py --self-test && PYTHONPATH=.pipeline/src python -m pipeline.providers.github task release-check --json"
      build-command: "python scripts/registry_checks.py release-build"
      artifact-path: "dist/*"
      asset-preparation-command: "python scripts/prepare-release-catalog.py"
      changelog-path: "CHANGELOG.md"
      working-directory: "."
      build-matrix-json: >-
        {"include":[
          {"id":"linux-amd64","os":"ubuntu-24.04","build_command":"PIPELINE_TARGET_OS=linux PIPELINE_TARGET_ARCH=x86_64 python scripts/registry_checks.py release-build"},
          {"id":"linux-arm64","os":"ubuntu-24.04-arm","build_command":"PIPELINE_TARGET_OS=linux PIPELINE_TARGET_ARCH=aarch64 python scripts/registry_checks.py release-build"},
          {"id":"darwin-amd64","os":"macos-15","build_command":"PIPELINE_TARGET_OS=macos PIPELINE_TARGET_ARCH=x86_64 python scripts/registry_checks.py release-build"},
          {"id":"darwin-arm64","os":"macos-15","build_command":"PIPELINE_TARGET_OS=macos PIPELINE_TARGET_ARCH=arm64 python scripts/registry_checks.py release-build"},
          {"id":"windows-amd64","os":"windows-latest","build_command":"PIPELINE_TARGET_OS=windows PIPELINE_TARGET_ARCH=x86_64 python scripts/registry_checks.py release-build"}
        ]}
