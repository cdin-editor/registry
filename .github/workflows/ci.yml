name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Registry quality gate (Pipeline)
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@c5cb4a661b9c15b679e422f3f4584c6f7ebe9e16
    with:
      language: go
      go-version: "1.27.3"
      pipeline-task: check
      pipeline-ref: c5cb4a661b9c15b679e422f3f4584c6f7ebe9e16

  release-catalog:
    name: Registry immutable Catalog release preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Test Catalog model and release identity validation
        run: python scripts/prepare-release-catalog.py --self-test
      - name: Verify immutable Pipeline release workflow pin
        run: python -m unittest discover -s tests -p "test_release_workflow_pin.py"
